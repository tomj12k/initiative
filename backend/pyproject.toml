[tool.poetry]
name = "initiative-backend"
version = "0.1.0"
description = "FastAPI backend for Initiative project management app"
authors = ["Jordan <jordan@morels.me>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = ">=0.141.1,<0.142.0"
uvicorn = { extras = ["standard"], version = ">=0.53,<0.54" }
sqlmodel = "^0.0.47"
asyncpg = "^0.31.0"
sqlalchemy = ">=2.0.54,<2.1.0"
PyJWT = "^2.15.0"
passlib = { extras = ["bcrypt"], version = "^1.7.4" }
bcrypt = "==4.3.0"
pydantic-settings = "^2.15.0"
python-multipart = ">=0.0.32,<0.1.0"
email-validator = "^2.3.0"
httpx = "^0.28.1"
alembic = "^1.20.0"
icalendar = ">=6.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-asyncio = "^1.4.0"
pytest-cov = "^7.1.0"
httpx = "^0.28.1"
ruff = ">=0.4.7,<0.16.0"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"
