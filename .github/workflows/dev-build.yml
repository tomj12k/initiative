name: Dev Build

on:
  push:
    branches:
      - dev
  workflow_dispatch: # Allow manual trigger

jobs:
  build-dev:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Get short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/initiative:dev
            ${{ secrets.DOCKERHUB_USERNAME }}/initiative:dev-${{ steps.sha.outputs.short }}
          build-args: |
            VITE_VERSION_SUFFIX=-dev-${{ steps.sha.outputs.short }}
          cache-from: type=gha,scope=docker-build
          cache-to: type=gha,scope=docker-build,mode=max
